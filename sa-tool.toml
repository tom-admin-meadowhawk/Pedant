# =============================================================================
# .NET
# =============================================================================

# -----------------------------------------------------------------------------
# Repository: TransferUI (C#, ASP.NET, net10.0)
# -----------------------------------------------------------------------------

[[repo]]
name = "TransferUI"
path = "C:\\Users\\tom.admin\\source\\repos\\TransferUI"

# Compiler warnings plus the SDK's built-in analyzers.
[[repo.tool]]
name = "dotnet-build"
command = "dotnet build TransferUI.slnx -c Release --no-incremental"

[[repo.tool]]
name = "dotnet-format-analyzers"
command = "dotnet format analyzers TransferUI.slnx --verify-no-changes --severity warn"

[[repo.tool]]
name = "dotnet-vulnerable-packages"
command = "dotnet list TransferUI.slnx package --vulnerable --include-transitive"


