version = 1

# Commands run with the repository root (`path`) as the working directory.
#
# No exceptions are defined yet. Add `[[repo.exception]]` tables under the
# relevant repository as needed (see static-analysis-config-spec.md).


# =============================================================================
# Rust
# =============================================================================

# -----------------------------------------------------------------------------
# Repository: doctor-directory
# -----------------------------------------------------------------------------

[[repo]]
name = "doctor-directory"
path = "C:\\Users\\tom.admin\\source\\repos\\doctor-directory"

[[repo.tool]]
name = "clippy"
command = "cargo clippy --all-targets"

# deny.toml's license allow-list is currently empty, so `licenses` rejects every crate.
[[repo.tool]]
name = "cargo-deny"
command = "cargo deny check"

[[repo.tool]]
name = "cargo-audit"
command = "cargo audit"


