# -----------------------------------------------------------------------------
# Repository: MeadowhawkUtils2 (VSTO Excel add-in, F# libraries, .NET Framework 4.8)
# -----------------------------------------------------------------------------

[[repo]]
name = "MeadowhawkUtils2"
path = "C:\\Users\\tom.admin\\source\\repos\\MeadowhawkUtils2"

# The VSTO project import requires MSBuild; `dotnet build` does not work here.
# Building the add-in also builds every F# library it references.
[[repo.tool]]
name = "msbuild"
command = "msbuild MeadowhawkUtils2\\MeadowhawkUtils2.csproj /t:Rebuild /p:Configuration=Release"

# Lints the F# projects; the solution's C# projects are not linted by FSharpLint.
[[repo.tool]]
name = "fsharplint"
command = "dotnet fsharplint lint MeadowhawkUtils2.slnx"


# =============================================================================
# Julia
# =============================================================================

# -----------------------------------------------------------------------------
# Repository: MHBData
# -----------------------------------------------------------------------------

[[repo]]
name = "MHBData"
path = "C:\\Users\\tom.admin\\source\\repos\\MHBData"

# `target_modules` limits reports to MHBData's own code (not Makie, DataFrames, etc.).
# JET prints "No errors detected" when clean.
[[repo.tool]]
name = "jet"
command = 'julia --project=. -e "using JET, MHBData; println(report_package(MHBData; target_modules=(MHBData,), toplevel_logger=nothing))"'


